# Start with `docker compose up -d`.
services:
  curatorr:
    image: ghcr.io/cosmin-sulita/curatorr:latest
    # To build from source instead, comment out `image` and use:
    # build: .
    container_name: curatorr
    restart: unless-stopped
    ports:
      - "7979:7979"
    environment:
      - TZ=Etc/UTC          # your time zone, e.g. Europe/Berlin
      - PUID=1000           # user/group that owns the config folder (run `id` on the host)
      - PGID=1000
    volumes:
      - ./:/config
