name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Never stop a run on main halfway through publishing a release.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Actions are pinned to commits, with their release in a comment: the image job pushes the latest
# image everyone pulls, and a tag can be moved. Nothing pushes with git, so checkouts don't keep the token.
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      # Both finish, so a failure shows whether it's only the older Node.
      fail-fast: false
      matrix:
        # 26 is what the image runs. 22.13 is the oldest Node that package.json promises, with the
        # npm 10 it comes with, as for contributors on Node 22.
        node: ['22.13.0', '26']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Builds the image a release would push, without pushing it, so a broken build shows up before main.
  # main only moves by fast-forwarding to develop, whose run has already built the same commit.
  image-check:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Then start it as people do, so the entrypoint, the healthcheck and shutting down are tested too.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: curatorr:check
          cache-from: type=gha
      - name: Start the image
        run: |
          fail() { echo "::error::$1"; exit 1; }
          # A file from before that the entrypoint must hand over to PUID:PGID.
          config="$RUNNER_TEMP/config"
          mkdir -p "$config" && touch "$config/older-file"
          docker run -d --name curatorr -e CURATORR_DEMO=1 -e PUID=1234 -e PGID=1234 \
            --health-start-interval 2s -v "$config:/config" curatorr:check
          for _ in $(seq 60); do
            status=$(docker inspect -f '{{.State.Health.Status}}' curatorr)
            [ "$status" = starting ] || break
            sleep 2
          done
          [ "$status" = healthy ] || fail "The container didn't become healthy: $status"

          # Curatorr runs as PUID:PGID, which owns the config folder, and keeps its database to itself.
          uid=$(docker exec curatorr awk '/^Uid:/{print $2}' /proc/1/status)
          [ "$uid" = 1234 ] || fail "Curatorr runs as uid $uid, not PUID 1234"
          owner=$(stat -c %u:%g "$config/older-file")
          [ "$owner" = 1234:1234 ] || fail "The config folder's files belong to $owner, not PUID:PGID"
          ls "$config"/curatorr*.db > /dev/null || fail "No database in the config folder"
          for f in "$config"/curatorr*.db*; do
            mode=$(stat -c %u:%a "$f")
            [ "$mode" = 1234:600 ] || fail "$(basename "$f") is $mode, not 1234:600"
          done

          # docker stop sends SIGTERM, which Curatorr answers by closing down and exiting with 0.
          docker stop -t 20 curatorr
          code=$(docker inspect -f '{{.State.ExitCode}}' curatorr)
          [ "$code" = 0 ] || fail "Curatorr exited with $code after SIGTERM"
      - name: Show its logs
        if: failure()
        run: docker logs curatorr

  # A release is a new top section in CHANGELOG.md, whose heading is also the app's version
  # (server/build.mjs). Once it reaches main, push its image, then tag it and publish its notes as a
  # GitHub Release, so a release never lacks its image: if the image fails, nothing is published and a
  # re-run starts over. Running the workflow by hand on main pushes the current release's image again,
  # built the same way: the Dockerfile pins its base images, so newer ones come with a release. Every
  # run checks the changelog, so a mistake in it fails on develop rather than halfway through a release.
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      new: ${{ steps.version.outputs.new }}
      publish: >-
        ${{ github.ref == 'refs/heads/main'
          && (steps.version.outputs.new == 'true' || github.event_name == 'workflow_dispatch') }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: version
        run: |
          # The first section must be the version: the release notes below are the first section,
          # while server/build.mjs and the app read the first version heading.
          heading=$(grep -m 1 '^## ' CHANGELOG.md || true)
          version=$(printf '%s\n' "$heading" | sed -n -E 's/^## ([0-9]+\.[0-9]+\.[0-9]+)( .*)?$/\1/p')
          if [ -z "$version" ]; then
            echo "::error file=CHANGELOG.md::The first '## ' heading must be '## x.y.z (date)', not '$heading'"
            exit 1
          fi
          if ! awk '/^## /{n++; next} n==1 && NF{found=1} END{exit !found}' CHANGELOG.md; then
            echo "::error file=CHANGELOG.md::The $version section is empty"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

          # Between releases the top version is the latest release. A new one must be newer: latest
          # follows it, and an older build would run on a database migrated by a newer one.
          if ! latest=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq '.tagName | ltrimstr("v")' 2>&1); then
            case "$latest" in
              *'release not found'*) latest= ;;
              *) echo "::error::Couldn't read the latest release: $latest"; exit 1 ;;
            esac
          fi
          if [ "$version" = "$latest" ]; then
            echo "new=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$latest" ] || [ "$(printf '%s\n%s\n' "$latest" "$version" | sort -V | tail -n 1)" = "$version" ]; then
            echo "new=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error file=CHANGELOG.md::$version is older than the latest release, $latest"
            exit 1
          fi

  image:
    needs: [test, version]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    # A hung build would otherwise hold main's queue, which is never cancelled, for six hours.
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          # GHCR describes a multi-platform image from its index, which only gets annotations.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ghcr.io/${{ github.repository }}
          # latest only moves with a release: x.y.z, x.y and latest all point at the same image.
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=v${{ needs.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ needs.version.outputs.version }}
            type=raw,value=latest
          # Otherwise it's the repository's About text, which can be empty.
          labels: org.opencontainers.image.description=Pick tonight's movie from your Radarr library.
          annotations: org.opencontainers.image.description=Pick tonight's movie from your Radarr library.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: [version, image]
    # A release commit is new on develop too, before main reaches it: only main releases it.
    if: github.ref == 'refs/heads/main' && needs.version.outputs.new == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          # The notes are the top section's body. An existing tag (e.g. pushed by hand) is reused.
          awk '/^## /{n++; next} n==1' CHANGELOG.md > notes.md
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Curatorr $VERSION" --notes-file notes.md
