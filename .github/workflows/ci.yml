name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Never stop a run on main halfway through publishing a release.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Builds the image a release would push, without pushing it, so a broken build shows up before main.
  # main only moves by fast-forwarding to develop, whose run has already built the same commit.
  image-check:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # A release is a new top section in CHANGELOG.md, whose heading is also the app's version
  # (server/build.mjs). Once it reaches main, push its image, then tag it and publish its notes as a
  # GitHub Release, so a release never lacks its image: if the image fails, nothing is published and a
  # re-run starts over. Running the workflow by hand on main rebuilds the current release's image,
  # e.g. for a newer base image. Every run checks the changelog, so a mistake in it fails on develop
  # rather than halfway through a release.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      new: ${{ steps.version.outputs.new }}
      publish: >-
        ${{ github.ref == 'refs/heads/main'
          && (steps.version.outputs.new == 'true' || github.event_name == 'workflow_dispatch') }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        run: |
          # The first section must be the version: the release notes below are the first section,
          # while server/build.mjs and the app read the first version heading.
          heading=$(grep -m 1 '^## ' CHANGELOG.md || true)
          version=$(printf '%s\n' "$heading" | sed -n -E 's/^## ([0-9]+\.[0-9]+\.[0-9]+)( .*)?$/\1/p')
          if [ -z "$version" ]; then
            echo "::error file=CHANGELOG.md::The first '## ' heading must be '## x.y.z (date)', not '$heading'"
            exit 1
          fi
          if ! awk '/^## /{n++; next} n==1 && NF{found=1} END{exit !found}' CHANGELOG.md; then
            echo "::error file=CHANGELOG.md::The $version section is empty"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

          # Between releases the top version is the latest release. A new one must be newer: latest
          # follows it, and an older build would run on a database migrated by a newer one.
          if ! latest=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq '.tagName | ltrimstr("v")' 2>&1); then
            case "$latest" in
              *'release not found'*) latest= ;;
              *) echo "::error::Couldn't read the latest release: $latest"; exit 1 ;;
            esac
          fi
          if [ "$version" = "$latest" ]; then
            echo "new=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$latest" ] || [ "$(printf '%s\n%s\n' "$latest" "$version" | sort -V | tail -n 1)" = "$version" ]; then
            echo "new=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error file=CHANGELOG.md::$version is older than the latest release, $latest"
            exit 1
          fi

  image:
    needs: [test, version]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          # latest only moves with a release: x.y.z, x.y and latest all point at the same image.
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=v${{ needs.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ needs.version.outputs.version }}
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: [version, image]
    # A release commit is new on develop too, before main reaches it: only main releases it.
    if: github.ref == 'refs/heads/main' && needs.version.outputs.new == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - run: |
          # The notes are the top section's body. An existing tag (e.g. pushed by hand) is reused.
          awk '/^## /{n++; next} n==1' CHANGELOG.md > notes.md
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Curatorr $VERSION" --notes-file notes.md
